name: Spine drift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps + build
        run: |
          npm ci
          npm run build

      - name: Compile spine
        run: |
          node dist/cli.js compile \
            --brief ./examples/brief.md \
            --repo . \
            --template saas-marketing \
            --name "project-spine (self)"

      - name: Drift check
        run: node dist/cli.js drift check --repo . --fail-on any

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spine-drift-report
          path: |
            .project-spine/drift-report.md
            .project-spine/drift-report.json
            .project-spine/warnings.json
          if-no-files-found: ignore
