name: Release

# A version tag packages one reviewed commit, publishes that exact tarball to
# npm through trusted publishing, then attaches the same tarball and generated
# changelog to a GitHub prerelease.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      tarball: ${{ steps.bundle.outputs.tarball }}
      integrity: ${{ steps.bundle.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.20.0

      - name: Report release toolchain
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Release workflow tests
        run: node --test .github/scripts/release-registry-state.test.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Public package surface
        run: npm run pack:check

      - name: Release readiness
        run: npm run release:readiness

      - name: Stable readiness
        run: npm run stable:check

      - name: Verify tag matches package.json
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          scripts/generate-changelog.sh > release-artifacts/CHANGELOG.generated.md
          awk -v heading="## [v${VERSION}]" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^## / && index($0, heading) != 1 { exit }
            printing { print }
          ' release-artifacts/CHANGELOG.generated.md > release-artifacts/release-notes.md
          if [ ! -s release-artifacts/release-notes.md ]; then
            echo "::error::generated changelog has no section for v${VERSION}"
            exit 1
          fi
          {
            echo ""
            echo "The full changelog generated from Git tags and commit history is attached to this release."
          } >> release-artifacts/release-notes.md

      - name: Pack the release tarball once
        id: bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --json --pack-destination release-artifacts > release-artifacts/npm-pack.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const [packed] = JSON.parse(readFileSync("release-artifacts/npm-pack.json", "utf8"));
          if (!packed?.filename || !packed?.integrity) throw new Error("npm pack did not return filename and integrity");
          if (packed.version !== process.env.VERSION) throw new Error(`packed ${packed.version}, expected ${process.env.VERSION}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${packed.version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${packed.filename}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${packed.integrity}\n`);
          NODE

      - name: Dry-run the exact local tarball publish
        run: npm publish "./release-artifacts/${{ steps.bundle.outputs.tarball }}" --dry-run --ignore-scripts --tag beta --access public

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      registry-verified: ${{ steps.verify.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.20.0

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-artifacts

      - name: Compare with any existing registry version
        id: before
        run: |
          node .github/scripts/release-registry-state.mjs \
            --pack-json release-artifacts/npm-pack.json \
            --tarball-dir release-artifacts \
            --package project-spine \
            --version "${{ needs.package.outputs.version }}" \
            --output "$GITHUB_OUTPUT"

      - name: Publish exact tarball through npm trusted publishing
        if: steps.before.outputs.published != 'true'
        run: npm publish "./release-artifacts/${{ needs.package.outputs.tarball }}" --provenance --tag beta --access public

      - name: Verify published tarball integrity
        id: verify
        run: |
          node .github/scripts/release-registry-state.mjs \
            --pack-json release-artifacts/npm-pack.json \
            --tarball-dir release-artifacts \
            --package project-spine \
            --version "${{ needs.package.outputs.version }}" \
            --require-published \
            --output "$GITHUB_OUTPUT"

  github-release:
    needs: [package, publish]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-artifacts

      - name: Record registry status without overstating publication
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REGISTRY_VERIFIED: ${{ needs.publish.outputs.registry-verified }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cp release-artifacts/release-notes.md release-artifacts/release-notes.final.md
          {
            echo ""
            echo "## Distribution status"
            echo ""
            if [ "$PUBLISH_RESULT" = "success" ] && [ "$REGISTRY_VERIFIED" = "true" ]; then
              printf 'npm registry publication for %s was verified against the attached tarball integrity.\n' "project-spine@${VERSION}"
              echo "New publications use the beta tag; verify live dist-tags separately."
              echo ""
              echo "## Install"
              echo ""
              echo '```bash'
              echo "npm install -g project-spine@${VERSION}"
              echo '```'
            else
              echo "npm registry publication was not verified in this workflow run."
              echo "The attached tarball passed the release gates, but it must not be described as published on npm."
            fi
          } >> release-artifacts/release-notes.final.md

      - name: Create or update GitHub prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-artifacts/release-notes.final.md
          files: |
            release-artifacts/${{ needs.package.outputs.tarball }}
            release-artifacts/CHANGELOG.generated.md
          fail_on_unmatched_files: true
          overwrite_files: ${{ needs.publish.result == 'success' && needs.publish.outputs.registry-verified == 'true' }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false
