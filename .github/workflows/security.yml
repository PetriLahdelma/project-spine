name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted by default; farm use is an explicit opt-in. Fork PRs remain hosted.
  audit-farm:
    if: github.event_name != 'pull_request' && vars.SPINE_USE_SELF_HOSTED == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, arm64, project-spine, macmini]
          - [self-hosted, linux, amd64, project-spine, gaming-pc]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm ci
        working-directory: apps/desktop
      - name: High severity npm audit
        run: npm audit --audit-level=high
      - name: High severity site audit
        run: npm audit --audit-level=high
        working-directory: site
      - name: High severity desktop audit
        run: npm audit --audit-level=high
        working-directory: apps/desktop
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit-hosted:
    if: github.event_name == 'pull_request' || vars.SPINE_USE_SELF_HOSTED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm ci
        working-directory: apps/desktop
      - name: High severity npm audit
        run: npm audit --audit-level=high
      - name: High severity site audit
        run: npm audit --audit-level=high
        working-directory: site
      - name: High severity desktop audit
        run: npm audit --audit-level=high
        working-directory: apps/desktop
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    needs: [audit-farm, audit-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the active audit leg to have passed
        run: |
          for r in "${{ needs.audit-farm.result }}" "${{ needs.audit-hosted.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "audit leg did not pass: $r"; exit 1 ;;
            esac
          done
          echo "audit passed"
