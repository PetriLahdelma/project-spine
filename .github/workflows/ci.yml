name: CI

on:
  push:
    branches: [main, ci/self-hosted-farm]
  pull_request:
    branches: [main, ci/self-hosted-farm]

permissions:
  contents: read

jobs:
  # Heavy compute on push-to-main runs on the self-hosted farm (both arches).
  test-farm:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        runner:
          - [self-hosted, linux, arm64, project-spine, macmini]
          - [self-hosted, linux, amd64, project-spine, gaming-pc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/spine-ci
        with:
          node-version: ${{ matrix.node }}
          use-hosted-cache: "false"

  # Fork pull requests NEVER touch the farm — they run on GitHub-hosted runners.
  test-hosted:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/spine-ci
        with:
          node-version: ${{ matrix.node }}
          use-hosted-cache: "true"

  site-farm:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, arm64, project-spine, macmini]
          - [self-hosted, linux, amd64, project-spine, gaming-pc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  site-hosted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  # Single stable required check: succeeds when the active legs passed (skipped is OK).
  gate:
    needs: [test-farm, test-hosted, site-farm, site-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the active legs to have passed
        run: |
          for r in "${{ needs.test-farm.result }}" "${{ needs.test-hosted.result }}" \
                   "${{ needs.site-farm.result }}" "${{ needs.site-hosted.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required leg did not pass: $r"; exit 1 ;;
            esac
          done
          echo "all active legs passed"
