name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Heavy compute on push-to-main runs on the self-hosted farm (both arches).
  test-farm:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        runner:
          - [self-hosted, linux, arm64, project-spine, macmini]
          - [self-hosted, linux, amd64, project-spine, gaming-pc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/spine-ci
        with:
          node-version: ${{ matrix.node }}
          use-hosted-cache: "false"
      # Report this node's gate result to the dashboard push-collector. Guarded to one
      # node-version so each arch posts once (not per node-version). This job is push-only
      # (job-level if), so the step never runs on fork PRs and the secret never reaches them.
      - name: Report CI result to dashboard collector
        if: ${{ always() && matrix.node == 22 }}
        env:
          CI_COLLECTOR_URL: ${{ vars.CI_COLLECTOR_URL }}
          CI_COLLECTOR_TOKEN: ${{ secrets.CI_COLLECTOR_TOKEN }}
          CI_REPORT_NODE: ${{ matrix.runner[4] }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/report-ci.sh

  # Fork pull requests NEVER touch the farm — they run on GitHub-hosted runners.
  test-hosted:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/spine-ci
        with:
          node-version: ${{ matrix.node }}
          use-hosted-cache: "true"

  # amd64 only: the site's transitive native dep (bufferutil via ws) has no arm64 prebuilt and
  # the runner container has no C toolchain, so node-gyp can't build it on arm64. The marketing
  # site isn't shipped per-arch, so amd64 (the parity primary) is sufficient. The main test job
  # keeps both arches.
  site-farm:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, amd64, project-spine, gaming-pc]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  site-hosted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  # Single stable required check: succeeds when the active legs passed (skipped is OK).
  gate:
    needs: [test-farm, test-hosted, site-farm, site-hosted]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the active legs to have passed
        run: |
          for r in "${{ needs.test-farm.result }}" "${{ needs.test-hosted.result }}" \
                   "${{ needs.site-farm.result }}" "${{ needs.site-hosted.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required leg did not pass: $r"; exit 1 ;;
            esac
          done
          echo "all active legs passed"
