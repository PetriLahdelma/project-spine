name: "Project Spine — drift check"
description: "Fail CI when AGENTS.md / CLAUDE.md / copilot-instructions have drifted from the brief or tokens since the last compile."
author: "Petri Lahdelma"
branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "project-spine npm dist-tag or exact semver. Examples: beta, latest, or a pinned release."
    required: false
    default: "beta"
  node-version:
    description: "Node.js version used to run the CLI."
    required: false
    default: "22"
  repo-path:
    description: "Repo root. Must contain a .project-spine/ directory produced by a prior `spine compile`."
    required: false
    default: "."
  fail-on:
    description: "Which drift kinds cause a non-zero exit: none | any | inputs | exports. Default 'any' fails on any drift."
    required: false
    default: "any"
  json:
    description: "If 'true', emit the structured drift report to the job log as JSON."
    required: false
    default: "false"

outputs:
  clean:
    description: "'true' if no drift was detected, 'false' otherwise. Read via steps.<id>.outputs.clean."
    value: ${{ steps.run.outputs.clean }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install project-spine
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: npm install -g "project-spine@${INPUT_VERSION}"

    - name: Run spine drift check
      id: run
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_REPO_PATH: ${{ inputs.repo-path }}
      run: |
        set +e
        args=(--repo "$INPUT_REPO_PATH" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_JSON" = "true" ]; then
          args+=(--json)
        fi
        spine drift check "${args[@]}"
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "clean=true" >> "$GITHUB_OUTPUT"
        else
          echo "clean=false" >> "$GITHUB_OUTPUT"
        fi
        exit $EXIT_CODE
