name: spine-ci
description: Shared project-spine build/test steps (farm + hosted callers).
inputs:
  node-version:
    required: true
  use-hosted-cache:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.use-hosted-cache == 'true' && 'npm' || '' }}
    - run: npm ci
      shell: bash
    - run: npm run typecheck
      shell: bash
    - run: npm run build
      shell: bash
    - run: npm test
      shell: bash
    - run: npm run pack:check
      shell: bash
    - run: npm run release:readiness
      shell: bash
    - run: npm run stable:check
      shell: bash
    - run: npm run assets:check
      shell: bash
    - name: Smoke — compile against sample brief
      shell: bash
      run: |
        node dist/cli.js compile --brief ./examples/brief.md --repo . \
          --template saas-marketing --name "ci-smoke" --version "0.0.0-ci"
        test -f .project-spine/spine.json
        test -f AGENTS.md
        test -f CLAUDE.md
        test -f .github/copilot-instructions.md
        test -f .cursor/rules/project-spine.mdc
